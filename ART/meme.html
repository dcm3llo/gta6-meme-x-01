<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;width:1024px;height:1024px;overflow:hidden;background:#1a0b24}
  .stage{position:relative;width:1024px;height:1024px;overflow:hidden;font-family:"Segoe UI",Arial,sans-serif;

  .sun{position:absolute;left:395px;top:300px;width:300px;height:300px;border-radius:50%;
    background:radial-gradient(circle at 50% 50%,#fff6d2 0%,#ffd98a 34%,#ff9d55 58%,rgba(255,110,80,.55) 70%,rgba(255,110,80,0) 78%)}
  .sea{position:absolute;left:0;top:566px;width:1024px;height:458px;background:linear-gradient(180deg,#3a1348 0%,#250e33 40%,#140a1e 100%)}
  .sunband{position:absolute;left:0;top:560px;width:1024px;height:6px;background:linear-gradient(90deg,rgba(255,190,120,0),rgba(255,214,150,.9),rgba(255,190,120,0))}
  .refl{position:absolute;height:5px;border-radius:3px;background:linear-gradient(90deg,rgba(255,150,110,0),rgba(255,186,140,.75),rgba(255,150,110,0))}
  .skyline{position:absolute;left:0;top:470px;width:1024px;height:100px}
  .palm{position:absolute;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
  .ghost{position:absolute;filter:drop-shadow(0 0 26px rgba(255,255,255,.45))}
  .title{position:absolute;left:58px;top:60px;right:58px;color:#fff}
  .kicker{font-size:23px;letter-spacing:9px;font-weight:700;color:rgba(255,235,245,.85);text-shadow:0 2px 8px rgba(20,0,20,.6)}
  .big{font-family:Impact,"Haettenschweiler","Arial Narrow Bold",sans-serif;font-size:118px;line-height:.98;letter-spacing:3px;margin-top:6px;text-shadow:0 6px 0 rgba(20,4,24,.35),0 10px 30px rgba(20,4,24,.55)}

  .joke{font-size:40px;font-weight:800;color:#fff2df;margin-top:10px;text-shadow:0 3px 12px rgba(20,4,24,.8)}
  .joke b{color:#ffd9a8}
  .barwrap{position:absolute;left:58px;top:690px;width:700px}
  .track{position:relative;height:22px;border-radius:12px;background:rgba(8,3,12,.6);box-shadow:inset 0 2px 6px rgba(0,0,0,.6);overflow:visible}
  .fill{position:absolute;left:0;top:0;bottom:0;width:9%;background:linear-gradient(90deg,#a31370,#e0359c);box-shadow:0 0 18px rgba(224,53,156,.8);border-radius:12px}
  .pct{position:absolute;right:-96px;top:-18px;font-family:Impact,"Haettenschweiler",sans-serif;font-size:46px;color:#ffd9a8;text-shadow:0 4px 10px rgba(0,0,0,.6)}
  .caption{position:absolute;left:60px;top:736px;font-size:24px;font-weight:600;color:rgba(255,240,230,.8);letter-spacing:.4px}
  .hint{position:absolute;left:58px;right:58px;top:790px;height:176px;border-radius:20px;background:rgba(10,4,15,.84);
    border-left:12px solid #c41c83;box-shadow:0 18px 40px rgba(0,0,0,.45);display:flex;align-items:center;gap:26px;padding:0 34px;box-sizing:border-box}
  .hint .tag{font-family:Impact,"Haettenschweiler",sans-serif;font-size:44px;color:#ff7ac0;letter-spacing:1px}
  .hint .txt{font-size:39px;font-weight:600;color:#fff;line-height:1.25}
  .hint .txt em{font-style:normal;color:#ff8fcb;font-weight:800}
  .foot{position:absolute;right:60px;top:974px;font-size:20px;letter-spacing:3px;color:rgba(255,235,245,.55);font-weight:700}
